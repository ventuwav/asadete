<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    @font-face {
      font-family: 'TeX Gyre Adventor';
      src: url('./fonts/texgyreadventor-bold.otf') format('opentype');
      font-weight: 700;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: linear-gradient(to bottom, #4a4a4a, #3D3D3D);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Grill watermark */
    .grill-bg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 80px;
      pointer-events: none;
    }
    .grill-bg svg {
      opacity: 0.07;
      width: 480px;
      height: 480px;
    }

    /* Content */
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      position: relative;
      z-index: 1;
    }

    .logo {
      width: 200px;
      height: 200px;
      object-fit: contain;
      filter: hue-rotate(-25deg) saturate(1.4) brightness(1.05);
      margin-bottom: 28px;
    }

    .brand {
      font-family: 'TeX Gyre Adventor', sans-serif;
      font-weight: 700;
      font-size: 96px;
      letter-spacing: 4px;
      color: white;
      line-height: 1;
      margin-bottom: 20px;
    }
    .brand .accent {
      color: #FF8C5A;
    }

    .divider {
      width: 160px;
      height: 2px;
      background: #FF8C5A;
      opacity: 0.4;
      border-radius: 1px;
      margin-bottom: 20px;
    }

    .tagline {
      font-family: 'Arial', sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }
  </style>
</head>
<body>
  <!-- Grill watermark -->
  <div class="grill-bg">
    <svg viewBox="0 0 24 24" fill="#cc5b0a" stroke="#cc5b0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 5v2" fill="none"/>
      <path d="M12 3v4" fill="none"/>
      <path d="M16 5v2" fill="none"/>
      <path d="M4 11h16a8 8 0 0 1-16 0Z"/>
      <line x1="2" y1="11" x2="22" y2="11"/>
      <line x1="7" y1="18.5" x2="5" y2="22"/>
      <line x1="17" y1="18.5" x2="19" y2="22"/>
    </svg>
  </div>

  <div class="content">
    <img class="logo" src="./logo-parrilla.png" alt="asaDeTe" />
    <div class="brand">
      asa<span class="accent">D</span>e<span class="accent">T</span>e
    </div>
    <div class="divider"></div>
    <div class="tagline">El DT de tu asado</div>
  </div>
</body>
</html>
