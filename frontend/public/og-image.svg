<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#3D3D3D"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9E4216"/>
      <stop offset="100%" stop-color="#FF8C5A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid overlay -->
  <rect width="1200" height="630" fill="none" stroke="white" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Grill icon — large watermark top right -->
  <g transform="translate(900, 80) scale(5.5)" fill="#cc5b0a" stroke="#cc5b0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.12">
    <path d="M8 5v2" fill="none"/>
    <path d="M12 3v4" fill="none"/>
    <path d="M16 5v2" fill="none"/>
    <path d="M4 11h16a8 8 0 0 1-16 0Z"/>
    <line x1="2" y1="11" x2="22" y2="11"/>
    <line x1="7" y1="18.5" x2="5" y2="22"/>
    <line x1="17" y1="18.5" x2="19" y2="22"/>
  </g>

  <!-- Grill icon — main centered -->
  <g transform="translate(495, 185) scale(4.5)" fill="#cc5b0a" stroke="#cc5b0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 5v2" fill="none"/>
    <path d="M12 3v4" fill="none"/>
    <path d="M16 5v2" fill="none"/>
    <path d="M4 11h16a8 8 0 0 1-16 0Z"/>
    <line x1="2" y1="11" x2="22" y2="11"/>
    <line x1="7" y1="18.5" x2="5" y2="22"/>
    <line x1="17" y1="18.5" x2="19" y2="22"/>
  </g>

  <!-- Brand name -->
  <text x="600" y="420" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="104" letter-spacing="6" fill="white">
    asa<tspan fill="#FF8C5A">D</tspan>e<tspan fill="#FF8C5A">T</tspan>e
  </text>

  <!-- Divider -->
  <rect x="530" y="444" width="140" height="2" rx="1" fill="#FF8C5A" opacity="0.4"/>

  <!-- Tagline -->
  <text x="600" y="498" text-anchor="middle" font-family="'Arial', 'Helvetica Neue', sans-serif" font-weight="700" font-size="22" letter-spacing="6" fill="white" opacity="0.35">
    EL DT DE TU ASADO
  </text>
</svg>
